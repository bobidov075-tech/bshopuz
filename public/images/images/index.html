<style>
  :root{
    --bg:#060B16; --bg-soft:#0D1B30; --card:#FFFFFF; --ink:#12161F;
    --ink-soft:#6B7284; --amber:#5B8CFF; --amber-deep:#2F5FD8; --line:#E5E8F0;
    --glass-bg: rgba(16,26,48,.55); --glass-bd: rgba(255,255,255,.14);
    --glass-bg-light: rgba(255,255,255,.65); --glass-bd-light: rgba(255,255,255,.5);
    --ease: cubic-bezier(.22,1,.36,1);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(91,140,255,.18), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(47,95,216,.14), transparent 55%),
      var(--bg);
    color:var(--card); font-family:'Inter',sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth;}
  a{color:inherit;}
  button{-webkit-tap-highlight-color:transparent;}
  button:active{transform:scale(.94);}
  button{transition:transform .18s var(--ease), background-color .25s var(--ease), opacity .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);}

  header{
    position:sticky; top:0; z-index:20;
    background:var(--glass-bg);
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    padding:env(safe-area-inset-top,0px) 0 0 0;
    border-bottom:1px solid var(--glass-bd);
    transition:background-color .3s var(--ease);
  }
  .bar{
    max-width:1100px; margin:0 auto; padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .logo{font-family:'Fraunces',serif; font-weight:700; font-size:26px; letter-spacing:.2px;}
  .logo span{color:var(--amber);}
  .bar-right{display:flex; align-items:center; gap:14px;}
  .lang-toggle{
    display:flex; border:1px solid var(--glass-bd); background:rgba(255,255,255,.06);
    backdrop-filter:blur(10px); border-radius:999px; overflow:hidden;
  }
  .lang-toggle button{
    background:none; border:none; color:var(--card); font:inherit; font-size:13px;
    padding:7px 14px; cursor:pointer; opacity:.6;
  }
  .lang-toggle button.active{background:var(--amber); color:#fff; opacity:1; font-weight:600; box-shadow:0 2px 10px rgba(91,140,255,.5);}
  .cart-btn{
    position:relative; background:rgba(255,255,255,.95); color:var(--ink); border:none;
    border-radius:999px; padding:9px 18px; font:inherit; font-size:14px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:8px;
    box-shadow:0 4px 16px rgba(0,0,0,.18);
  }
  .cart-count{
    background:var(--amber-deep); color:#fff; border-radius:999px; min-width:20px; height:20px;
    font-size:12px; display:flex; align-items:center; justify-content:center; padding:0 5px;
    transition:transform .3s var(--ease);
  }
  .cart-count.bump{animation:bump .4s var(--ease);}
  @keyframes bump{ 0%{transform:scale(1);} 35%{transform:scale(1.45);} 100%{transform:scale(1);} }

  .hero{max-width:1100px; margin:0 auto; padding:56px 24px 36px;}
  .hero h1{
    font-family:'Fraunces',serif; font-weight:700; font-size:clamp(34px,5vw,54px);
    line-height:1.08; margin:0 0 14px; max-width:14ch;
  }
  .hero p{color:rgba(255,248,236,.72); max-width:52ch; font-size:16px; line-height:1.6; margin:0;}

  .categories{
    max-width:1100px; margin:0 auto; padding:0 24px 8px; display:flex; gap:10px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .categories::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; border:1px solid var(--glass-bd); background:rgba(255,255,255,.06);
    backdrop-filter:blur(10px); color:var(--card);
    padding:9px 18px; border-radius:999px; font:inherit; font-size:14px; cursor:pointer;
  }
  .chip.active{background:var(--amber); color:#fff; border-color:var(--amber); font-weight:600; box-shadow:0 4px 14px rgba(91,140,255,.4);}

  main{max-width:1100px; margin:0 auto; padding:28px 24px 80px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px;}
  .product{
    background:rgba(255,255,255,.97); color:var(--ink); border-radius:20px; padding:16px;
    display:flex; flex-direction:column; gap:10px; border:1px solid rgba(255,255,255,.6);
    box-shadow:0 8px 24px rgba(3,8,20,.28);
    transition:transform .35s var(--ease), box-shadow .35s var(--ease);
  }
  .product:hover{transform:translateY(-4px); box-shadow:0 14px 34px rgba(3,8,20,.34);}
  .thumb{
    aspect-ratio:1/1; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:46px; background:linear-gradient(145deg,#EEF2FB,#DCE4F7); overflow:hidden; position:relative;
  }
  .thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:opacity .28s var(--ease), transform .5s var(--ease);}
  .badge{
    position:absolute; left:10px; top:10px; background:rgba(255,255,255,.92); color:var(--ink);
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; z-index:2;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .product:hover .thumb img{transform:scale(1.06);}
  .product h3{margin:0; font-size:16px; font-weight:600; line-height:1.3;}
  .product .cat{font-size:12px; color:var(--ink-soft); margin:-6px 0 0;}
  .row{display:flex; align-items:center; justify-content:space-between; margin-top:auto; gap:10px;}
  .price{font-weight:700; font-size:17px;}
  .add-btn{
    background:var(--ink); color:#fff; border:none; border-radius:10px;
    padding:9px 14px; font:inherit; font-size:13px; font-weight:600; cursor:pointer;
  }
  .add-btn:disabled{opacity:.35; cursor:not-allowed;}
  .add-btn.ok{background:#2FBE6B;}
  .size-row{display:flex; flex-wrap:wrap; gap:6px;}
  .size-btn{
    border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px;
    padding:5px 9px; font:inherit; font-size:12px; cursor:pointer;
  }
  .size-btn.active{background:var(--amber); color:#fff; border-color:var(--amber);}
  .color-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .color-btn{
    width:28px; height:28px; border-radius:50%; border:2px solid var(--line);
    cursor:pointer; padding:0; position:relative; flex:none;
  }
  .color-btn.active{border-color:var(--amber); box-shadow:0 0 0 3px rgba(91,140,255,.28);}
  .color-btn.active::after{
    content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700;
  }
  .color-btn[data-light="1"].active::after{color:#171208;}
  .color-btn[data-light="0"].active::after{color:#fff;}

  /* Cart drawer */
  .overlay{
    position:fixed; inset:0; background:rgba(5,9,18,.5); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none;
    transition:opacity .35s var(--ease); z-index:30;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:min(380px,92vw);
    background:var(--glass-bg); backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    border-left:1px solid var(--glass-bd);
    color:var(--card); z-index:31; transform:translateX(100%);
    transition:transform .4s var(--ease); display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:20px 20px 10px; display:flex; justify-content:space-between; align-items:center;}
  .drawer-head h2{font-family:'Fraunces',serif; font-size:22px; margin:0;}
  .close{background:none; border:none; color:var(--card); font-size:22px; cursor:pointer; line-height:1;}
  .cart-list{flex:1; overflow-y:auto; padding:0 20px; display:flex; flex-direction:column; gap:14px;}
  .cart-item{display:flex; gap:12px; align-items:center; border-bottom:1px solid rgba(255,255,255,.08); padding-bottom:14px;}
  .cart-item .thumb{width:52px; height:52px; font-size:24px; flex:none; aspect-ratio:auto; overflow:hidden;}
  .cart-item .info{flex:1; min-width:0;}
  .cart-item .info .nm{font-size:14px; font-weight:600;}
  .qty{display:flex; align-items:center; gap:8px;}
  .qty button{
    width:24px; height:24px; border-radius:7px; border:1px solid rgba(255,255,255,.2);
    background:none; color:var(--card); cursor:pointer; font-size:15px; line-height:1;
  }
  .empty{color:rgba(255,248,236,.55); font-size:14px; padding:30px 0; text-align:center;}
  .drawer-foot{padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));}
  .total{display:flex; justify-content:space-between; font-size:15px; margin-bottom:12px;}
  .checkout-btn{
    width:100%; background:var(--amber); color:#fff; border:none; border-radius:12px;
    padding:14px; font:inherit; font-size:15px; font-weight:700; cursor:pointer;
    box-shadow:0 6px 20px rgba(91,140,255,.4);
  }
  .checkout-btn:disabled{opacity:.35; cursor:not-allowed; box-shadow:none;}

  /* Order modal */
  .modal{
    position:fixed; inset:0; z-index:40; display:flex; align-items:flex-end; justify-content:center;
    background:rgba(5,9,18,.55); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .3s var(--ease);
  }
  @media (min-width:640px){ .modal{align-items:center;} }
  .modal.open{opacity:1; pointer-events:auto;}
  .modal-card{
    background:rgba(255,255,255,.85); backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);
    color:var(--ink); width:100%; max-width:440px;
    border-radius:22px 22px 0 0; padding:24px; transform:translateY(24px) scale(.98);
    transition:transform .4s var(--ease);
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -10px 40px rgba(3,8,20,.3);
  }
  @media (min-width:640px){ .modal-card{border-radius:20px;} }
  .modal.open .modal-card{transform:translateY(0);}
  .modal-card h2{font-family:'Fraunces',serif; margin:0 0 4px; font-size:22px;}
  .modal-card p.sub{margin:0 0 18px; color:var(--ink-soft); font-size:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font:inherit; font-size:14px; background:#fff; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .ghost-btn{
    flex:1; background:none; border:1px solid var(--line); border-radius:12px; padding:12px;
    font:inherit; font-weight:600; cursor:pointer; color:var(--ink);
  }
  .submit-btn{
    flex:2; background:var(--ink); color:var(--card); border:none; border-radius:12px;
    padding:12px; font:inherit; font-weight:700; cursor:pointer;
  }
  .success{text-align:center; padding:10px 0;}
  .success .tick{font-size:40px;}
  .tg-contact-btn{
    width:100%; margin-top:10px; background:#229ED9; color:#fff; border:none;
    border-radius:12px; padding:13px; font:inherit; font-size:15px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    text-decoration:none; box-shadow:0 6px 18px rgba(34,158,217,.4);
    animation:shake 1.6s ease-in-out .3s infinite;
  }
  @keyframes shake{
    0%,18%,100%{ transform:translateX(0) rotate(0); }
    3%{ transform:translateX(-4px) rotate(-2deg); }
    6%{ transform:translateX(4px) rotate(2deg); }
    9%{ transform:translateX(-4px) rotate(-2deg); }
    12%{ transform:translateX(4px) rotate(2deg); }
    15%{ transform:translateX(-2px) rotate(-1deg); }
  }
  [data-i18n]{display:inline;}
  [hidden]{display:none !important;}

  .tg-float{
    position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom,0px));
    width:58px; height:58px; border-radius:50%; background:#229ED9; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:28px;
    text-decoration:none; box-shadow:0 10px 24px rgba(0,0,0,.4); z-index:25;
    transition:transform .15s;
  }
  .tg-float:hover{transform:scale(1.06);}
  .tg-tooltip{
    position:fixed; right:84px; bottom:calc(30px + env(safe-area-inset-bottom,0px));
    background:var(--card); color:var(--ink); font-size:13px; font-weight:600;
    padding:8px 12px; border-radius:10px; z-index:25; white-space:nowrap;
    box-shadow:0 6px 16px rgba(0,0,0,.25);
  }
  @media (max-width:520px){ .tg-tooltip{display:none;} }

  .fly-dot{
    position:fixed; z-index:50; pointer-events:none; border-radius:10px;
    background:linear-gradient(145deg,var(--amber),var(--amber-deep)); overflow:hidden;
    box-shadow:0 8px 20px rgba(91,140,255,.5);
    transition:transform .65s cubic-bezier(.3,.6,.25,1), opacity .65s cubic-bezier(.3,.6,.25,1), border-radius .65s var(--ease);
  }
  .fly-dot img{width:100%; height:100%; object-fit:cover; display:block;}

  .toast-wrap{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center;
    pointer-events:none;
  }
  .toast{
    background:rgba(18,22,31,.78); color:#fff; backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid rgba(255,255,255,.14);
    padding:12px 18px; border-radius:999px; font-size:14px; font-weight:600;
    display:flex; align-items:center; gap:8px; white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    opacity:0; transform:translateY(14px) scale(.96);
    transition:opacity .35s var(--ease), transform .35s var(--ease);
  }
  .toast.show{opacity:1; transform:translateY(0) scale(1);}
  .toast .ic{
    width:20px; height:20px; border-radius:50%; background:#2FBE6B;
    display:flex; align-items:center; justify-content:center; font-size:12px; flex:none;
  }
</style>
</head>

const PRODUCTS = [

  {id:'balon', uz:"Balon kurtkalar", ru:"Пуховики"},
  {id:'shim', uz:"Shimlar", ru:"Брюки"},

  cart:{uz:"Savat",ru:"Корзина"},
  heroTitle:{uz:"Xohlagan narsangizni toping, bitta joyda buyurtma bering",ru:"Найдите нужное и закажите в один клик"},

  contactTg:{uz:"Sotuvchi bilan bog'laning",ru:"Свяжитесь с продавцом"},
};

let lang = 'uz';
let activeCat = 'all';
let cart = {}; // id -> qty

function t(key){ return I18N[key][lang]; }
function fmt(n){ return n.toLocaleString('ru-RU') + " so'm"; }

function renderStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(I18N[k]) el.textContent = I18N[k][lang];
  });
}

function renderCategories(){
  const wrap = document.getElementById('categories');
  wrap.innerHTML = '';
  CATS.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'chip' + (c.id===activeCat ? ' active':'');
    b.textContent = c[lang];
    b.onclick = ()=>{ activeCat = c.id; renderCategories(); renderGrid(); };
    wrap.appendChild(b);
  });
}

function isLightHex(hex){
  const h = hex.replace('#','');
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return (r*299 + g*587 + b*114)/1000 > 170;
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const list = activeCat==='all' ? PRODUCTS : PRODUCTS.filter(p=>p.cat===activeCat);
  list.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'product';
    const colorsHtml = p.colors ? `<div class="color-row">${p.colors.map(cid=>{
      const c = COLORS[cid];
      return `<button class="color-btn" data-color="${cid}" data-light="${isLightHex(c.hex)?1:0}" style="background:${c.hex}" title="${c[lang]}" aria-label="${c[lang]}"></button>`;
    }).join('')}</div>` : '';
    const sizesHtml = p.sizes ? `<div class="size-row">${p.sizes.map(s=>`<button class="size-btn" data-size="${s}">${s}</button>`).join('')}</div>` : '';
    const thumbHtml = p.img ? `<img src="${p.img}" alt="${p.name[lang]}" onerror="this.replaceWith(document.createTextNode('${p.emoji}'))">` : p.emoji;
    const badgeHtml = p.tag ? `<span class="badge">${p.tag[lang]}</span>` : '';
    const needsChoice = !!(p.colors || p.sizes);
    card.innerHTML = `
      <div class="thumb">${badgeHtml}${thumbHtml}</div>
      <h3>${p.name[lang]}</h3>
      ${colorsHtml}
      ${sizesHtml}
      <div class="row">
        <span class="price">${fmt(p.price)}</span>
        <button class="add-btn"${needsChoice ? ' disabled':''}>${t('add')}</button>
      </div>`;
    const addBtn = card.querySelector('.add-btn');

    function refreshAddState(){
      const colorOk = !p.colors || !!addBtn.dataset.color;
      const sizeOk = !p.sizes || !!addBtn.dataset.size;
      addBtn.disabled = !(colorOk && sizeOk);
    }

    if(p.colors){
      const colorBtns = card.querySelectorAll('.color-btn');
      colorBtns.forEach(cb=>{
        cb.onclick = ()=>{
          colorBtns.forEach(x=>x.classList.remove('active'));
          cb.classList.add('active');
          addBtn.dataset.color = cb.dataset.color;

          // Rang tugmasi bosilganda — agar shu rang uchun alohida rasm bo'lsa, kartochka rasmini almashtiradi
          const newSrc = p.colorImages && p.colorImages[cb.dataset.color];
          if(newSrc){
            const imgEl = card.querySelector('.thumb img');
            if(imgEl){
              imgEl.style.opacity = '0';
              setTimeout(()=>{ imgEl.src = newSrc; imgEl.style.opacity = '1'; }, 140);
            }
          }
          refreshAddState();
        };
      });
    }
    if(p.sizes){
      const sizeBtns = card.querySelectorAll('.size-btn');
      sizeBtns.forEach(sb=>{
        sb.onclick = ()=>{
          sizeBtns.forEach(x=>x.classList.remove('active'));
          sb.classList.add('active');
          addBtn.dataset.size = sb.dataset.size;
          refreshAddState();
        };
      });
    }
    addBtn.onclick = ()=>{
      const parts = [p.id];
      if(addBtn.dataset.color) parts.push('c'+addBtn.dataset.color);
      if(addBtn.dataset.size) parts.push('s'+addBtn.dataset.size);
      const key = parts.join('::');
      cart[key] = (cart[key]||0)+1;
      syncCart();
      showToast(t('addedToast'));
      const currentImgEl = card.querySelector('.thumb img');
      const currentImgSrc = currentImgEl ? currentImgEl.getAttribute('src') : p.img;
      flyToCart(card.querySelector('.thumb'), currentImgSrc, p.emoji);
      addBtn.classList.add('ok');
      setTimeout(()=> addBtn.classList.remove('ok'), 500);
    };
    grid.appendChild(card);
  });
}

function syncCart(){
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('checkoutBtn').disabled = count===0;

  const list = document.getElementById('cartList');
  list.innerHTML = '';
  if(count===0){
    list.innerHTML = `<div class="empty">${t('emptyCart')}</div>`;
  } else {
    let total = 0;
    Object.entries(cart).forEach(([key,qty])=>{
      const parts = key.split('::');
      const id = parts[0];
      let colorId = '', size = '';
      parts.slice(1).forEach(part=>{
        if(part[0]==='c') colorId = part.slice(1);
        else if(part[0]==='s') size = part.slice(1);
      });
      const p = PRODUCTS.find(x=>x.id==id);
      total += p.price*qty;
      const variantBits = [];
      if(colorId && COLORS[colorId]) variantBits.push(COLORS[colorId][lang]);
      if(size) variantBits.push(size);
      const variantText = variantBits.length ? ` · ${variantBits.join(' / ')}` : '';
      const itemImg = (p.colorImages && colorId && p.colorImages[colorId]) || p.img;
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `
        <div class="thumb">${itemImg ? `<img src="${itemImg}" alt="">` : p.emoji}</div>
        <div class="info">
          <div class="nm">${p.name[lang]}${variantText}</div>
          <div class="qty">
            <button data-d="-1">−</button><span>${qty}</span><button data-d="1">+</button>
          </div>
        </div>
        <strong>${fmt(p.price*qty)}</strong>`;
      row.querySelectorAll('button').forEach(btn=>{
        btn.onclick = ()=>{
          const d = parseInt(btn.dataset.d);
          cart[key] = (cart[key]||0)+d;
          if(cart[key]<=0) delete cart[key];
          syncCart();
        };
      });
      list.appendChild(row);
    });
    document.getElementById('totalPrice').textContent = fmt(total);
  }
  if(count===0) document.getElementById('totalPrice').textContent = fmt(0);
}

function showToast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="ic">✓</span><span>${msg}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(()=> requestAnimationFrame(()=> el.classList.add('show')));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 400);
  }, 1600);
}

function flyToCart(sourceEl, imgSrc, emoji){
  const cartBtn = document.getElementById('cartBtn');
  if(!sourceEl || !cartBtn) return;
  const startRect = sourceEl.getBoundingClientRect();
  const endRect = cartBtn.getBoundingClientRect();

  const dot = document.createElement('div');
  dot.className = 'fly-dot';
  const size = 46;
  dot.style.width = size+'px';
  dot.style.height = size+'px';
  dot.style.left = (startRect.left + startRect.width/2 - size/2) + 'px';
  dot.style.top = (startRect.top + startRect.height/2 - size/2) + 'px';
  dot.style.opacity = '1';
  if(imgSrc){
    dot.innerHTML = `<img src="${imgSrc}" alt="">`;
  } else {
    dot.style.display = 'flex'; dot.style.alignItems='center'; dot.style.justifyContent='center';
    dot.style.fontSize = '20px';
    dot.textContent = emoji || '🛍️';
  }
  document.body.appendChild(dot);

  const dx = (endRect.left + endRect.width/2) - (startRect.left + startRect.width/2);
  const dy = (endRect.top + endRect.height/2) - (startRect.top + startRect.height/2);

  requestAnimationFrame(()=>{
    dot.style.transform = `translate(${dx}px, ${dy}px) scale(.25)`;
    dot.style.opacity = '0';
    dot.style.borderRadius = '50%';
  });

  setTimeout(()=>{
    dot.remove();
    const count = document.getElementById('cartCount');
    count.classList.remove('bump');
    void count.offsetWidth;
    count.classList.add('bump');
  }, 620);
}

function openDrawer(open){
  document.getElementById('drawer').classList.toggle('open', open);
  document.getElementById('overlay').classList.toggle('open', open);
}

function openModal(open){
  document.getElementById('modal').classList.toggle('open', open);
}

function buildOrderForm(){
  document.getElementById('modalCard').innerHTML = `
    <h2>${t('modalTitle')}</h2>
    <p class="sub">${t('modalSub')}</p>
    <div class="field"><label>${t('nameLbl')}</label><input id="f_name" type="text"></div>
    <div class="field"><label>${t('phoneLbl')}</label><input id="f_phone" type="tel" placeholder="+998 90 123 45 67"></div>
    <div class="field"><label>${t('addrLbl')}</label><input id="f_addr" type="text"></div>
    <div class="field"><label>${t('noteLbl')}</label><textarea id="f_note"></textarea></div>
    <div class="modal-actions">
      <button class="ghost-btn" id="cancelOrder">${t('cancel')}</button>
      <button class="submit-btn" id="confirmOrder">${t('confirm')}</button>
    </div>`;
  document.getElementById('cancelOrder').onclick = ()=> openModal(false);
  document.getElementById('confirmOrder').onclick = async ()=>{
    const name = document.getElementById('f_name').value.trim();
    const phone = document.getElementById('f_phone').value.trim();
    const address = document.getElementById('f_addr').value.trim();
    const note = document.getElementById('f_note').value.trim();

    if(!name || !phone){
      alert(lang==='uz' ? "Ism va telefon raqamni kiriting" : "Введите имя и номер телефона");
      return;
    }

    const items = Object.entries(cart).map(([key,qty])=>{
      const parts = key.split('::');
      const id = parts[0];
      let colorId = '', size = '';
      parts.slice(1).forEach(part=>{
        if(part[0]==='c') colorId = part.slice(1);
        else if(part[0]==='s') size = part.slice(1);
      });
      const p = PRODUCTS.find(x=>x.id==id);
      const variantBits = [];
      if(colorId && COLORS[colorId]) variantBits.push(COLORS[colorId][lang]);
      if(size) variantBits.push(size);
      const variantText = variantBits.length ? ` (${variantBits.join(' / ')})` : '';
      return { name: p.name[lang] + variantText, qty, price: p.price };
    });
    const total = items.reduce((s,i)=> s + i.price*i.qty, 0);

    const btn = document.getElementById('confirmOrder');
    btn.disabled = true; btn.textContent = '...';

    try{
      const resp = await fetch('/api/order', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name, phone, address, note, items, total })
      });
      const data = await resp.json();
      if(!data.ok) throw new Error(data.error || 'error');

      document.getElementById('modalCard').innerHTML = `
        <div class="success">
          <div class="tick">✅</div>
          <h2>${t('successTitle')}</h2>
          <p class="sub">${t('successSub')}</p>
          <a class="tg-contact-btn" id="tgContactBtn" href="https://t.me/qwertyyy616" target="_blank" rel="noopener">💬 ${t('contactTg')}</a>
          <button class="submit-btn" style="width:100%; margin-top:10px;" id="closeSuccess">${t('closeBtn')}</button>
        </div>`;
      document.getElementById('closeSuccess').onclick = ()=>{
        openModal(false); openDrawer(false);
        cart = {}; syncCart();
      };
    }catch(err){
      alert(lang==='uz' ? "Xatolik yuz berdi, qayta urinib ko'ring" : "Произошла ошибка, попробуйте снова");
      btn.disabled = false; btn.textContent = t('confirm');
    }
  };
}

document.getElementById('cartBtn').onclick = ()=> openDrawer(true);
document.getElementById('closeDrawer').onclick = ()=> openDrawer(false);
document.getElementById('overlay').onclick = ()=> openDrawer(false);
document.getElementById('checkoutBtn').onclick = ()=>{ buildOrderForm(); openModal(true); };

document.querySelectorAll('.lang-toggle button').forEach(btn=>{
  btn.onclick = ()=>{
    lang = btn.dataset.lang;
    document.querySelectorAll('.lang-toggle button').forEach(b=>b.classList.toggle('active', b===btn));
    renderStatic(); renderCategories(); renderGrid(); syncCart();
  };
});

renderStatic();
renderCategories();
renderGrid();
syncCart();
</script>
